[build]
  command = "cd CreditRoot && npm install --legacy-peer-deps && npm run build"
  publish = "CreditRoot/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev --prefix CreditRoot"
  targetPort = 5173
  port = 8888
  framework = "vite"
  publish = "CreditRoot/dist"

[[redirects]]
  from = "/api/cetes-rate"
  to = "/.netlify/functions/cetes-rate"
  status = 200

[[redirects]]
  from = "/api/exchange-rate"
  to = "/.netlify/functions/exchange-rate"
  status = 200

[[redirects]]
  from = "/api/auth/google"
  to = "/.netlify/functions/auth-google"
  status = 200

[[redirects]]
  from = "/api/etherfuse/onboarding"
  to = "/.netlify/functions/etherfuse-onboarding"
  status = 200

[[redirects]]
  from = "/api/etherfuse/deposit"
  to = "/.netlify/functions/etherfuse-deposit"
  status = 200

[[redirects]]
  from = "/api/etherfuse/webhook"
  to = "/.netlify/functions/etherfuse-webhook"
  status = 200

[[redirects]]
  from = "/api/etherfuse/order-status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/metas"
  to = "/.netlify/functions/metas"
  status = 200

[[redirects]]
  from = "/api/sign-intent"
  to = "/.netlify/functions/sign-intent"
  status = 200

[[redirects]]
  from = "/api/cuenta/preparar"
  to = "/.netlify/functions/cuenta-preparar"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
